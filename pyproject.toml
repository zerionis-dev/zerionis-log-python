[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerionis-log"
version = "0.1.0"
description = "Structured JSON logging for Python/FastAPI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Zerionis", email = "oss@zerionis.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
fastapi = ["starlette>=0.27"]
sql = ["sqlalchemy>=2.0"]
otel = ["opentelemetry-api>=1.20"]
fast = ["orjson>=3.9"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "uvicorn>=0.23",
    "starlette>=0.27",
    "orjson>=3.9",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/zerionis-dev/zerionis-log-python"
Repository = "https://github.com/zerionis-dev/zerionis-log-python"
Issues = "https://github.com/zerionis-dev/zerionis-log-python/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["zerionis_log"]
